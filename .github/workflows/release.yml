name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v?\d') { $tag = "v0.0.0" }
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, no runtime needed on the PC)
        shell: pwsh
        run: >
          dotnet publish RedControlUtility/RedControlUtility.csproj -c Release -r win-x64 -p:Platform=x64
          -p:Version=${{ steps.ver.outputs.version }} -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          -p:PublishReadyToRun=false -o publish

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppName=Red Control Utility" "/DAppExe=RedControlUtility.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\publish" installer\RCU.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath dist\RCU-Portable-${{ steps.ver.outputs.version }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RCU-Setup-*.exe
            dist/RCU-Portable-*.zip
          generate_release_notes: true
