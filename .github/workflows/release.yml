name: Release

on:
  push:
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Read project version
        id: ver
        shell: pwsh
        run: |
          [xml]$project = Get-Content RedControlUtility/RedControlUtility.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and ($env:GITHUB_REF_NAME -creplace '^v', '') -ne $version) {
            throw "Release tag $env:GITHUB_REF_NAME does not match project version $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained)
        shell: pwsh
        run: msbuild RedControlUtility/RedControlUtility.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RcuBuildInstaller=false "/p:PublishDir=$env:GITHUB_WORKSPACE/publish/"

      - name: Verify published files
        shell: pwsh
        run: |
          [xml]$project = Get-Content RedControlUtility/RedControlUtility.csproj -Raw
          $allowedCultures = $project.SelectSingleNode('/Project/PropertyGroup/SatelliteResourceLanguages').InnerText.Split(';')
          $unexpected = Get-ChildItem publish -Directory | Where-Object {
            $_.Name -match '^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$' -and $_.Name -notin $allowedCultures
          }
          if ($unexpected) { throw "Unexpected culture folders: $($unexpected.Name -join ', ')" }
          $expectedLocales = 'en-US', 'pt-BR', 'es-ES', 'zh-CN'
          $baseline = (Get-Content publish/locales/en-US.json -Raw | ConvertFrom-Json -AsHashtable).Keys
          $localeFiles = Get-ChildItem publish/locales -Filter '*.json' -File -Recurse
          if (Compare-Object $expectedLocales @($localeFiles.BaseName)) { throw 'Unexpected set of published locales.' }
          foreach ($file in $localeFiles) {
            $keys = (Get-Content $file.FullName -Raw | ConvertFrom-Json -AsHashtable).Keys
            if (Compare-Object @($baseline) @($keys)) { throw "Translation keys differ in $($file.Name)." }
          }
          $versionInfo = (Get-Item publish/RedControlUtility.exe).VersionInfo
          if ($versionInfo.ProductVersion -ne '${{ steps.ver.outputs.version }}' -or
              $versionInfo.ProductName -ne $project.SelectSingleNode('/Project/PropertyGroup/Product').InnerText) {
            throw 'Published executable metadata does not match the project.'
          }

      - name: Build installer
        shell: pwsh
        run: |
          $inno = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $inno
          $install = Start-Process $inno -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSourceDir=..\publish" installer\RCU.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'dist/RCU-Setup-${{ steps.ver.outputs.version }}.exe')) { throw 'Expected installer not found.' }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath dist\RCU-Portable-${{ steps.ver.outputs.version }}.zip

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: RCU-${{ steps.ver.outputs.version }}
          path: |
            dist/RCU-Setup-*.exe
            dist/RCU-Portable-*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RCU-Setup-*.exe
            dist/RCU-Portable-*.zip
          generate_release_notes: true
